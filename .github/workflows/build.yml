name: Build OXYGEN APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create signing key (first run only)
        if: github.event_name != 'pull_request'
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storetype PKCS12 \
              -storepass oxygen123 -keypass oxygen123 -alias oxygen \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OXYGEN, O=OXYGEN, C=US"
            git config user.name "oxygen-bot"
            git config user.email "oxygen-bot@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add app signing key"
            git push origin HEAD:main
          fi

      - name: Build APK
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2g -PonesignalAppId="$ONESIGNAL_APP_ID"

      - name: Upload test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OXYGEN-native-push-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OXYGEN.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OXYGEN.apk --title "OXYGEN latest build" --notes "Latest OXYGEN Android build" --target "$GITHUB_SHA"
