name: Build OXYGEN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create signing key (first run only)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storetype PKCS12 \
              -storepass oxygen123 -keypass oxygen123 -alias oxygen \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OXYGEN, O=OXYGEN, C=US"
            git config user.name "oxygen-bot"
            git config user.email "oxygen-bot@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add app signing key"
            git push origin HEAD:main
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2g

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OXYGEN.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OXYGEN.apk --title "OXYGEN latest build" --notes "Latest OXYGEN Android build" --target "$GITHUB_SHA"
